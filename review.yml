actions:
  openapiHarvested: true
  openapiCount: 2
  openapiProvenance: dsb-cds-standard (not provider-authored)
  apisListed: 3
  apisYmlCreated: true
  reason: >-
    Alinta Energy is a genuine live CDR energy implementation, which makes it a
    useful control case rather than a compliance stub. But nothing here is a
    developer product. Two API entries are real and anonymously callable — a status
    pair Alinta hosts, and a 493-plan catalogue the regulator hosts — and the third,
    the consumer data surface the mandate actually exists to create, is listed
    without a baseURL because Alinta publishes none. The mandate was replicated.
    The developer-facing implementation was not.
