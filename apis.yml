- aid: alinta-energy:alinta-energy-cdr-generic-plan-data-api
  name: Alinta Energy CDR Generic Plan Data API
  description: >-
    Alinta Energy's public electricity and gas plan catalogue, exposed as the CDR
    energy Generic Plan Data endpoints GET /energy/plans and
    GET /energy/plans/{planId}. Confirmed live on 2026-07-27 with HTTP 200 returning
    meta.totalRecords of 493 Alinta plans, and a plan detail fetch for planId
    ALI1144886SRG2@EME returning HTTP 200 at x-v 3. This data is genuinely open —
    no key, no consent, no accreditation — but the critical fact is that it is NOT
    served by Alinta. Unlike Australian banking, where every bank hosts its own
    Product Reference Data, the CDR energy regime centralises generic plan data at
    the Australian Energy Regulator, and this endpoint runs on the AER's Energy Made
    Easy CDR platform under the retailer slug "alinta". Alinta's own host returns
    404 for the same path.
  humanURL: https://www.energymadeeasy.gov.au/
  baseURL: https://cdr.energymadeeasy.gov.au/alinta/cds-au/v1
