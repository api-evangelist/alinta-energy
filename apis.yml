- aid: alinta-energy:alinta-energy-cdr-energy-api
  name: Alinta Energy CDR Energy API
  description: >-
    The mandated consumer data-sharing surface. As a designated CDR energy data
    holder (register brand ID 8bd0fd93-9d26-ee11-a83d-000d3a8830d6, ABN 22149658300),
    Alinta must serve the Consumer Data Standards energy resource endpoints —
    accounts, balances, invoices, billing, payment schedules, concessions,
    electricity service points, interval usage and distributed energy resources —
    to ACCC-accredited data recipients holding a valid consumer consent. No baseURL
    is recorded because none is published: the mTLS resource and infosec base URIs
    are disclosed only through the CDR Register's authenticated data holder brand
    detail endpoint, which requires an accredited client certificate. Probes of
    secure., idp. and cdr. subdomains of alintaenergy.com.au did not resolve, and
    no /.well-known/openid-configuration is served anonymously. The contract below
    is the shared Data Standards Body specification Alinta implements, not an
    Alinta-authored document.
  humanURL: https://www.alintaenergy.com.au/help-and-support/terms-and-conditions/consumer-data-right-cdr
