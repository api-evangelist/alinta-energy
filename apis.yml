apis:
- aid: alinta-energy:alinta-energy-cdr-discovery-api
  name: Alinta Energy CDR Discovery API
  description: >-
    The only API Alinta Energy serves from its own infrastructure that a developer
    can call anonymously. Two unauthenticated operations mandated by the Australian
    Consumer Data Standards for every data holder — GET /discovery/status and
    GET /discovery/outages — which report whether the data holder's CDR surface is
    operational and disclose planned or current outages. Both were confirmed live on
    2026-07-27 with HTTP 200 and header x-v 1, returning status "OK" ("All services
    operational") and an empty outages array. No other path under this base URI
    resolves; /energy/plans and /common/customer both returned HTTP 404.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#discovery-apis
  baseURL: https://public.cdr.alintaenergy.com.au/cds-au/v1
  tags:
  - Consumer Data Right
  - Discovery
  - Status
  - Outages
  properties:
