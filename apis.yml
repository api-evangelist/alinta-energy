name: Alinta Energy
kind: company
description: >-
  Alinta Energy is one of Australia's largest integrated energy retailers
  and generators, owned by Hong Kong-based Chow Tai Fook Enterprises, supplying electricity
  and gas to more than a million homes and businesses across Western Australia, South
  Australia, Victoria, New South Wales and Queensland while operating an owned and
  contracted generation portfolio of roughly 3,000 MW spanning gas, coal, wind, solar
  and battery storage, plus the Lumo Energy retail brand. It sits at the retail end
  of the value chain — the tier the Australian Consumer Data Right binds. Alinta is
  a designated and live CDR energy data holder: its own public base URI
  https://public.cdr.alintaenergy.com.au serves the standards-conformant discovery
  endpoints (confirmed HTTP 200), and 493 of its energy plans are published
  anonymously through the CDR generic plan data channel — but that plan channel is
  hosted by the Australian Energy Regulator's Energy Made Easy platform, not by
  Alinta. Its API posture is therefore honestly summarised as mandate-implemented
  but developer-closed: everything of substance sits behind ACCC accreditation and
  consumer consent, Alinta publishes no developer portal, no self-serve API, no
  proprietary OpenAPI and no open grid or market data of its own.
