sla:
  availability_target: 99.5% per month
  availability_scope: All CDR endpoints, authenticated and unauthenticated; excludes planned outages.
  planned_outage_notice: At least one week's lead time for normal outages, published to Data Recipient Software Products; critical security fixes may occur without notice.
  performance:
    rule: 95% of calls per hour within the nominated response-time threshold.
    thresholds:
      unauthenticated: 1500ms
      high_priority: 1000ms (includes Get Status, Get Outages, Get Energy Accounts, Get Energy Account Detail, Get Balance For Energy Account, Get Invoices For Account, Get Customer, Get Customer Detail)
      low_priority: 1500ms
      unattended: 4000ms
      large_payload: 6000ms (Get Bulk Billing, Get Billing For Specific Accounts)
      secondary_request: 1000ms (data holders) / 1500ms (secondary data holders)
      large_secondary_request: 1500ms (data holders) / 4500ms (secondary data holders)
  source: https://consumerdatastandardsaustralia.github.io/standards/#non-functional-requirements
  note: Enforced by the ACCC under the CDR rules; there is no Alinta-authored SLA document.
