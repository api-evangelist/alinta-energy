note: >
  Alinta Energy publishes no versioning, deprecation or SLA document of its own. Its
  lifecycle obligations are set entirely by the Consumer Data Standards and the CDR
  rules, which bind it as a designated energy data holder. The one lifecycle surface
  Alinta genuinely operates is the CDR Common Discovery pair — a live, public,
  machine-readable status and planned-outage feed on its own infrastructure.
