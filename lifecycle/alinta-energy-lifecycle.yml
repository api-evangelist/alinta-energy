  docs: https://consumerdatastandardsaustralia.github.io/standards/#endpoint-versioning
deprecation:
  policy: >
    Endpoint versions are superseded and retired through the Consumer Data Standards
    Future Dated Obligation (FDO) process: each change names a date by which data holders
    MUST implement the new endpoint version and a later date from which they MAY retire
    the prior version. Obsolete versions stay published in the standard for reference.
  examples_binding_alinta:
  - endpoint: Get Generic Plan Detail
    obligation: Data holders MUST implement v3 by 11 November 2024; MAY retire v2 from 3 March 2025.
  - endpoint: Get Energy Account Detail
    obligation: Data holders MUST implement v4 by 11 November 2024; MAY retire v3 from 3 March 2025.
  - endpoint: Transaction Security Ciphers
    obligation: Data holders and recipients MUST only support BCP195-recommended ciphers by 17 March 2025.
  obsolete_versions_documented: true
  policy_url: https://consumerdatastandardsaustralia.github.io/standards/#versioning
  obligation_schedule: https://consumerdatastandardsaustralia.github.io/standards/#future-dated-obligations
  sunset_header: false
  note: RFC 8594 Sunset/Deprecation headers are not used; retirement is scheduled by dated obligation, not by header.
