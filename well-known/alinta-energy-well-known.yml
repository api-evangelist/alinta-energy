note: >
  The standard /.well-known/ discovery surface was probed on every host in apis.yml
  (Alinta's own CDR public base URI, the AER-hosted Energy Made Easy CDR host that
  serves Alinta's generic plan data, and the Alinta corporate web estate). Nothing is
  published. Alinta's own CDR host answers 404 for every /.well-known/ path, and the
  corporate site answers 403 to all automated clients (site-wide WAF), so a 403 is NOT
  evidence that a document exists. No anonymous OpenID Connect discovery document is
  served: under the Consumer Data Standards a data holder's infosec base URI (and
  therefore its /.well-known/openid-configuration) is disclosed only through the CDR
  Register's authenticated data holder brand DETAIL endpoint, which requires an
  ACCC-accredited client certificate.
  In place of /.well-known/, the machine-readable operational discovery surface Alinta
  DOES serve is the CDR Common Discovery pair — /cds-au/v1/discovery/status and
  /cds-au/v1/discovery/outages — both confirmed HTTP 200 (see
  lifecycle/alinta-energy-lifecycle.yml).
